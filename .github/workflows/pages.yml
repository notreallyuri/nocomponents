name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deploy job needs these; nothing else in the repo does.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and let a newer commit finish rather than cancelling it mid-upload.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: jetli/trunk-action@v0.5.0
        with:
          version: latest

      - uses: actions/configure-pages@v5
        id: pages

      # A project page is served under the repository name, so the asset URLs and the router's
      # base have to agree on it. `configure-pages` resolves the path for a custom domain too.
      - name: Build
        working-directory: docs
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: trunk build --release --public-url "${BASE_PATH}/"

      # Pages has no rewrite rule, so a deep link like /nocomponents/docs/button would 404 before
      # the app ever boots. Serving the same document for a miss hands routing back to the client.
      - name: SPA fallback
        run: cp docs/dist/index.html docs/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
