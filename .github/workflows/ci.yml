name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check

      # The library compiles almost nothing without features, so the flag is the point.
      - run: cargo clippy --features full -- -D warnings

      - run: cargo clippy -p nocomponents-cli -- -D warnings

      - run: cargo check -p docs

      # Covers `tests/features.rs`, which checks the per-element feature table against the imports.
      - run: cargo test --features full

      - run: cargo test -p nocomponents-cli

      # One narrow slice, because `--features full` builds whether or not the element features are
      # right and this is the shape a consumer actually asks for.
      - run: cargo check --no-default-features --features primitives,sidebar

  smoke:
    name: browser smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: jetli/trunk-action@v0.5.0
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Builds the docs with trunk, sweeps every page and runs the interaction checks in the
      # Chrome the runner image ships. A cold build can outrun the default ten minutes.
      - name: Smoke
        env:
          CHROME: /usr/bin/google-chrome
          SMOKE_BUILD_TIMEOUT_MIN: 30
          CHROME_NO_SANDBOX: "1"
          SMOKE_CHROME_START_SEC: 90
        run: node docs/smoke/run.mjs
