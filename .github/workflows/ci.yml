name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check

      # The library compiles almost nothing without features, so the flag is the point.
      - run: cargo clippy --features full -- -D warnings

      - run: cargo check -p docs

      # Covers `tests/features.rs`, which checks the per-element feature table against the imports.
      - run: cargo test --features full

      # One narrow slice, because `--features full` builds whether or not the element features are
      # right and this is the shape a consumer actually asks for.
      - run: cargo check --no-default-features --features primitives,sidebar
