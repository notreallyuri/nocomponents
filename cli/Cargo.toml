[package]
name = "nocomponents-cli"
version = "0.1.0"
edition = "2024"
description = "Adds nocomponents' styled layer to a Leptos project as source you own"
repository = "https://github.com/notreallyuri/nocomponents"
homepage = "https://notreallyuri.github.io/nocomponents/"
license = "Apache-2.0"
readme = "README.md"
keywords = ["leptos", "ui", "components", "cli", "cargo-subcommand"]
categories = ["command-line-utilities", "development-tools::cargo-plugins"]
rust-version = "1.88"
# This crate reads the tag matching its own version (`remote.rs`), so it is released with the
# library and never ahead of it.

# `cargo nocli …` finds a binary called `cargo-nocli` on PATH and hands it `nocli` as argv[1].
[[bin]]
name = "cargo-nocli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "sync"] }
toml = "1.0"
