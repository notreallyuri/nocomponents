[package]
name = "nocomponents-cli"
version = "0.1.0"
edition = "2024"
description = "Adds nocomponents' styled layer to a Leptos project as source you own"

# `cargo nocli …` finds a binary called `cargo-nocli` on PATH and hands it `nocli` as argv[1].
[[bin]]
name = "cargo-nocli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
toml = "1.0"
